name: Girru with Code
on:
  workflow_dispatch:
    inputs:
      girru_sha:
        description: Exact Girru main revision to package
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: girru-code-release-${{ inputs.girru_sha }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: mac-arm64, target: 'dist:mac'}
          - {os: macos-15-intel, platform: mac-x64, target: 'dist:mac'}
          - {os: windows-latest, platform: win-x64, target: 'dist:win'}
          - {os: ubuntu-22.04, platform: linux-x64, target: 'dist:linux'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      npm_config_fund: 'false'
      npm_config_audit: 'false'
      npm_config_fetch_retries: '5'
      NODE_OPTIONS: '--max-old-space-size=4096'
      GIRRU_SHA: ${{ inputs.girru_sha }}
    steps:
      - name: Validate source revision
        run: node -e "if(!/^[a-f0-9]{40}$/.test(process.env.GIRRU_SHA))throw Error('Exact main SHA required')"
      - uses: actions/checkout@v4
        with:
          path: editor-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Dpro-at/Girru
          ref: ${{ inputs.girru_sha }}
          path: girru
          persist-credentials: false
      - name: Verify Girru main revision
        shell: bash
        run: test "$(git -C girru ls-remote origin refs/heads/main | cut -f1)" = "$GIRRU_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev libssl-dev
      - name: Install locked editor dependencies
        run: node editor-source/scripts/install-ci.mjs
      - name: Audit shipped editor dependencies
        shell: bash
        run: |
          npm audit --prefix editor-source/editor --omit=dev --audit-level=low
          npm audit --prefix editor-source/editor/remote --omit=dev --audit-level=low
          for folder in markdown-language-features markdown-math notebook-renderers; do
            npm audit --prefix "editor-source/editor/extensions/$folder" --omit=dev --audit-level=low
          done
      - name: Build and type-check editor
        shell: bash
        working-directory: editor-source
        run: |
          npm --prefix editor run build-fast -- --client-only
          npm --prefix editor run gulp -- transpile-extensions compile-extension-media copy-codicons
          npm --prefix editor run typecheck-client
          node --test tests/editor-runtime.test.mjs
      - name: Install locked Girru dependencies
        shell: bash
        working-directory: girru
        run: |
          npm ci --prefix packages/backend
          npm ci --prefix packages/core-ui
          npm ci --prefix packages/desktop
      - name: Build and test Girru
        shell: bash
        working-directory: girru
        timeout-minutes: 20
        run: |
          node packages/core-ui/scripts/build.cjs
          node packages/core-ui/scripts/build.cjs --candidate --live-entry
          npm --prefix packages/core-ui run typecheck
          node --import ./scripts/test-temp-root.mjs --test --test-concurrency=2 --test-timeout=90000 packages/core-ui/tests/*.test.cjs
          node --import ./scripts/test-temp-root.mjs --test --test-timeout=90000 packages/desktop/test/*.test.cjs
          cd packages/backend
          npx --no-install tsc --noEmit
          node --import tsx --import ../../scripts/test-temp-root.mjs --test test/chat-reply-rounds.test.mjs test/discovery-fs.test.mjs test/first-run-steps.test.mjs test/local-import-durable.test.mjs test/dependency-contracts.test.mjs test/cli-invocation.test.mjs test/desktop-args.test.mjs test/safe-logging.test.mjs test/regular-file-read.test.mjs test/extension-resource-path.test.mjs
      - name: Stage Code and verify native runtime
        shell: bash
        run: |
          node girru/packages/desktop/scripts/stage-nabu.cjs --nabu editor-source --out girru/packages/desktop/nabu-runtime
          node girru/packages/desktop/scripts/verify-code.cjs girru/packages/desktop/nabu-runtime
          node -e "require('fs').writeFileSync('girru/packages/desktop/nabu-runtime/provenance.json',JSON.stringify({editor:process.env.GITHUB_SHA,girru:process.env.GIRRU_SHA,platform:'${{ matrix.platform }}'},null,2))"
      - name: Stage production Girru runtime
        shell: bash
        working-directory: girru
        run: |
          npm prune --omit=dev --prefix packages/backend
          mkdir -p .release-empty-modules
          node packages/desktop/scripts/stage-payload.cjs --root-modules .release-empty-modules
      - name: Build installers
        working-directory: girru
        run: npm --prefix packages/desktop run ${{ matrix.target }}
      - name: Verify complete unpacked application
        working-directory: girru
        run: node packages/desktop/scripts/verify-release.cjs
      - name: Collect checksummed installers
        working-directory: girru
        shell: bash
        run: |
          node packages/desktop/scripts/collect-release.cjs ${{ matrix.platform }}
          node -e "const fs=require('fs'),crypto=require('crypto');const name='BUILD-PROVENANCE-${{ matrix.platform }}.json',root='packages/desktop/release/publish/';const bytes=fs.readFileSync('packages/desktop/nabu-runtime/provenance.json');fs.writeFileSync(root+name,bytes);fs.appendFileSync(root+'SHA256SUMS-${{ matrix.platform }}.txt',crypto.createHash('sha256').update(bytes).digest('hex')+'  '+name+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: girru/packages/desktop/release/publish/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
